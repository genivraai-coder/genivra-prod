version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  file:
    class: logging.FileHandler
    level: INFO
    formatter: standard
    filename: logs/project.log
    mode: a
    encoding: utf-8

loggers:
  root:
    level: INFO
    handlers: [console, file]
    propagate: true

  ml_pipeline:
    level: INFO
    handlers: [console, file]
    propagate: false

  data:
    level: INFO
    handlers: [console, file]
    propagate: false

  features:
    level: INFO
    handlers: [console, file]
    propagate: false

  models:
    level: INFO
    handlers: [console, file]
    propagate: false

  evaluation:
    level: INFO
    handlers: [console, file]
    propagate: false