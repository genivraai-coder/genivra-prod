version: '3.8'

services:
  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: genivra-api
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      TIER_1_MONTHLY_LIMIT: 100
      TIER_2_MONTHLY_LIMIT: 0
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8000,http://127.0.0.1:3000,http://127.0.0.1:8000"
      DEPLOYMENT_PLATFORM: docker
      # Optional: Database connection (uncomment to use PostgreSQL)
      # DATABASE_URL: postgresql://genivra:genivra@db:5432/genivra
    volumes:
      - .:/app
      - /app/__pycache__
    command: uvicorn API.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db
    networks:
      - genivra-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # PostgreSQL Database (optional, for future migration)
  db:
    image: postgres:15-alpine
    container_name: genivra-db
    environment:
      POSTGRES_USER: genivra
      POSTGRES_PASSWORD: genivra
      POSTGRES_DB: genivra
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - genivra-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genivra"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: genivra-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@genivra.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - genivra-network

volumes:
  postgres_data:
    driver: local

networks:
  genivra-network:
    driver: bridge
